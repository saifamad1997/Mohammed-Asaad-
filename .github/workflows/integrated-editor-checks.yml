name: Integrated editor checks
on:
  push:
    branches: [feature/integrated-3d-editor]
  pull_request:
    branches: [feature/integrated-3d-editor]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-editor-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
